name: New Relic Autopilot
slug: new-relic-autopilot
url: https://docs.newrelic.com/docs/agentic-ai/autopilot/overview/
summary: >-
  New Relic's managed AI operations assistant, formerly SRE Agent, correlates telemetry
  and recent changes to investigate incidents and suggest likely causes and recovery steps.
  It is generally available for Pro or Enterprise organizations with Advanced Compute or a
  legacy Compute plan, but is not available for FedRAMP accounts.
  Autopilot recommends actions for an engineer to review and execute; it does not apply them.
deployment:
  - saas
opensource: false
tags:
