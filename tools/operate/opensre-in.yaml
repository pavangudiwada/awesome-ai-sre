name: OpenSRE.in
slug: opensre-in
url: https://opensre.in/
summary: >-
  Self-hosted AI SRE project for production incident investigation, with episodic memory, a Neo4j service-topology graph,
  a web console, and Slack and Microsoft Teams interfaces. It calls Anthropic directly by default; LiteLLM is an optional
  provider proxy, so self-hosting does not mean model traffic stays local.
deployment:
  - on-prem
opensource: true
