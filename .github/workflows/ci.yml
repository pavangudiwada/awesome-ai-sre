name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validate, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SITE_URL: https://aisre.pavangudiwada.dev
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
      AUTH_INTENT_SECRET: ci-auth-intent-secret-at-least-32-characters
      ANALYTICS_HASH_SECRET: ci-analytics-hash-secret-at-least-32-characters

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate catalog contracts
        run: npm run validate:catalog

      - name: Validate legacy tool records
        run: npm run validate:tools

      - name: Audit catalog assets
        run: npm run audit:assets -- --max-warnings=4

      - name: Check UI consistency
        run: npm run check:ui

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  browser:
    name: Browser and mobile workflows
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://aisre.pavangudiwada.dev
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
      AUTH_INTENT_SECRET: ci-auth-intent-secret-at-least-32-characters
      ANALYTICS_HASH_SECRET: ci-analytics-hash-secret-at-least-32-characters

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Run public workflow tests
        run: npm run test:e2e

  database:
    name: Replay and lint Supabase migrations
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase services
        run: npx supabase start -x studio,imgproxy,inbucket,edge-runtime,analytics,vector

      - name: Replay migrations from a clean database
        run: npx supabase db reset --local --no-seed

      - name: Lint private database schema
        run: npx supabase db lint --local --schema private --level error --fail-on error

      - name: Stop local Supabase services
        if: always()
        run: npx supabase stop --no-backup
